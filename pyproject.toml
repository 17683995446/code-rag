[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-graph-memory"
version = "4.0.0"
description = "Production-grade Knowledge Graph Memory System with Open-Source Tooling"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Knowledge Graph Team", email = "team@kg-memory.dev"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
]
keywords = ["knowledge-graph", "memory-system", "networkx", "graph", "ai"]

dependencies = [
    "networkx>=3.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-pyyaml>=6.0.0",
    "types-networkx>=3.0.0",
]
web = [
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/kg-memory/knowledge-graph-memory"
Documentation = "https://docs.kg-memory.dev"
Repository = "https://github.com/kg-memory/knowledge-graph-memory"
Issues = "https://github.com/kg-memory/knowledge-graph-memory/issues"

[project.scripts]
kg-memory = "kg_memory.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kg_memory = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = "\\.pyi?$"
exclude = '''
/(
    \\.git
  | \\.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "ISC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
