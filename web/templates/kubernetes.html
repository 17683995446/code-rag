<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes 配置生成 - Code RAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <nav class="glass sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="flex items-center gap-3">
                <div class="w-10 h-10 gradient-bg rounded-lg flex items-center justify-center">
                    <i class="fas fa-cloud text-white text-xl"></i>
                </div>
                <span class="text-xl font-bold">Code RAG <span class="text-purple-400">v24.0</span></span>
            </a>
            <div class="flex gap-6">
                <a href="/" class="hover:text-purple-400 transition">首页</a>
                <a href="/kubernetes" class="text-purple-400 font-semibold">Kubernetes</a>
                <a href="/docker" class="hover:text-purple-400 transition">Docker</a>
                <a href="/cloud" class="hover:text-purple-400 transition">云服务</a>
                <a href="/cicd" class="hover:text-purple-400 transition">CI/CD</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <h1 class="text-4xl font-bold mb-2">
            <i class="fas fa-dharmachakra mr-3 text-blue-400"></i>Kubernetes 配置生成
        </h1>
        <p class="text-gray-400 mb-8">生成完整的 Kubernetes 资源配置</p>

        <div class="grid md:grid-cols-2 gap-8">
            <div class="glass rounded-2xl p-6">
                <h2 class="text-xl font-semibold mb-6">📝 配置参数</h2>
                <form id="k8s-form" class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">应用名称</label>
                        <input type="text" name="app_name" value="my-app" 
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:border-purple-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">容器镜像</label>
                        <input type="text" name="image" value="my-app:v1" 
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:border-purple-500 outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">端口</label>
                            <input type="number" name="port" value="8080" 
                                class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:border-purple-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">副本数</label>
                            <input type="number" name="replicas" value="3" 
                                class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:border-purple-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">命名空间</label>
                        <input type="text" name="namespace" value="default" 
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:border-purple-500 outline-none">
                    </div>
                    <button type="submit" 
                        class="w-full gradient-bg py-3 rounded-lg font-semibold hover:opacity-90 transition">
                        <i class="fas fa-magic mr-2"></i>生成配置
                    </button>
                </form>
            </div>

            <div class="glass rounded-2xl p-6">
                <h2 class="text-xl font-semibold mb-6">📄 生成结果</h2>
                <div id="result" class="space-y-4">
                    <div class="text-gray-400 text-center py-12">
                        <i class="fas fa-file-code text-4xl mb-4 opacity-50"></i>
                        <p>点击"生成配置"按钮开始生成</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('k8s-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch('/api/generate/kubernetes', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    let html = '';
                    for (const [filename, content] of Object.entries(data.configs)) {
                        html += `
                            <div class="bg-gray-800 rounded-lg p-4">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="font-mono text-sm text-purple-400">${filename}</span>
                                    <button onclick="copyToClipboard('${filename}')" class="text-gray-400 hover:text-white">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                </div>
                                <pre class="text-xs text-green-400 overflow-x-auto max-h-60">${escapeHtml(content)}</pre>
                            </div>
                        `;
                    }
                    document.getElementById('result').innerHTML = html;
                } else {
                    document.getElementById('result').innerHTML = `
                        <div class="bg-red-900/50 border border-red-500 rounded-lg p-4 text-red-400">
                            <i class="fas fa-exclamation-triangle mr-2"></i>${data.error}
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <div class="bg-red-900/50 border border-red-500 rounded-lg p-4 text-red-400">
                        <i class="fas fa-exclamation-triangle mr-2"></i>请求失败: ${error.message}
                    </div>
                `;
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function copyToClipboard(filename) {
            const content = document.querySelector(`#result pre`).textContent;
            navigator.clipboard.writeText(content);
            alert('已复制到剪贴板!');
        }
    </script>
</body>
</html>
